name: Release upstream Qwen for Linux

on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
    inputs:
      force_recheck:
        description: Recheck an already detected upstream identity
        required: false
        type: boolean
        default: false

concurrency:
  group: qwen-linux-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NPM_VERSION: "12.0.1"

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.detect.outputs.action }}
      version: ${{ steps.detect.outputs.version }}
      build: ${{ steps.detect.outputs.build }}
      identity: ${{ steps.detect.outputs.identity }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - id: detect
        env:
          FORCE_RECHECK: ${{ inputs.force_recheck || false }}
        run: |
          result=$(node scripts/upstream-release.mjs detect)
          printf '%s\n' "$result"
          node -e 'const r=JSON.parse(process.argv[1]); for (const k of ["action","version","build","identity","reason"]) console.log(`${k}=${r[k]}`)' "$result" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-detection
          path: .stage/upstream/
          retention-days: 1
          if-no-files-found: error

  ingest:
    needs: detect
    if: needs.detect.outputs.action == 'build'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: upstream-detection
          path: .stage/upstream
      - run: npm run upstream:ingest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-ingest
          path: .stage/upstream/qwen-upstream-ingest.tar.gz
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [detect, ingest]
    if: needs.detect.outputs.action == 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global npm@${NPM_VERSION}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y imagemagick fakeroot dpkg squashfs-tools xvfb libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1 libnotify4 libatspi2.0-0 libdrm2 libxkbcommon0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/downloads
          key: qwen-linux-runtime-${{ runner.os }}-${{ hashFiles('scripts/prepare-linux.mjs') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: upstream-ingest
          path: .stage/upstream
      - run: |
          rm -rf asar-src extract release.json latest-mac.yml
          tar -xzf .stage/upstream/qwen-upstream-ingest.tar.gz
          mkdir -p .stage/upstream
          cp release.json .stage/upstream/release.json
          cp latest-mac.yml .stage/upstream/latest-mac.yml
      - run: npm run package:linux
      - run: node scripts/verify-linux-package.mjs --layout=unpacked --root=dist/linux-unpacked
      - run: |
          rm -rf .stage/appimage-root .stage/deb-root
          dist/Qwen-${{ needs.detect.outputs.version }}-linux-x86_64.AppImage --appimage-extract >/dev/null
          mv squashfs-root .stage/appimage-root
          dpkg-deb -x dist/qwen_${{ needs.detect.outputs.version }}_amd64.deb .stage/deb-root
          node scripts/verify-linux-package.mjs --layout=appimage --root=.stage/appimage-root
          node scripts/verify-linux-package.mjs --layout=deb --root=.stage/deb-root
      - run: npm test
      - run: xvfb-run -a node scripts/smoke-linux.mjs --version=${{ needs.detect.outputs.version }}
      - run: xvfb-run -a node scripts/smoke-updater-mode.mjs
      - run: xvfb-run -a node scripts/smoke-updater-mode.mjs --appimage=dist/Qwen-${{ needs.detect.outputs.version }}-linux-x86_64.AppImage --expect-requests
      - run: |
          mkdir -p .stage/release-assets
          cp dist/Qwen-${{ needs.detect.outputs.version }}-linux-x86_64.AppImage .stage/release-assets/
          cp dist/qwen_${{ needs.detect.outputs.version }}_amd64.deb .stage/release-assets/
          cp dist/latest-linux.yml .stage/release-assets/
          cp .stage/upstream/release.json .stage/release-assets/upstream-release.json
          cp .stage/upstream/latest-mac.yml .stage/release-assets/upstream-latest-mac.yml
          cd .stage/release-assets
          sha256sum Qwen-${{ needs.detect.outputs.version }}-linux-x86_64.AppImage qwen_${{ needs.detect.outputs.version }}_amd64.deb latest-linux.yml upstream-release.json upstream-latest-mac.yml > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: .stage/release-assets/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [detect, build]
    if: needs.detect.outputs.action == 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: quantmind-br
          repositories: qwen-studio-linux-releases
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: .stage/release-assets
      - env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/publish-release.mjs

  issue:
    needs: [detect, ingest, build, release]
    if: always() && needs.detect.result != 'cancelled' && needs.detect.outputs.action != 'noop'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        if: secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != ''
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: quantmind-br
          repositories: qwen-studio-linux
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: upstream-detection
          path: .stage/upstream
      - env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_STAGE: detect=${{ needs.detect.result }}, ingest=${{ needs.ingest.result }}, build=${{ needs.build.result }}, release=${{ needs.release.result }}
        run: |
          if [[ "${{ needs.release.result }}" == "success" ]]; then
            node scripts/manage-release-issue.mjs close
          else
            node scripts/manage-release-issue.mjs fail
          fi
