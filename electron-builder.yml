appId: com.qwen.chat
productName: Qwen
directories:
  app: .stage/app
  output: dist
  buildResources: build
asar: true
files:
  - package.json
  - out/**
  - node_modules/**
  - i18n/**
  - assets/**
extraResources:
  - from: .stage/runtime/bun/linux-x64
    to: bun/linux-x64
  - from: .stage/runtime/python/linux-x64
    to: python/linux-x64
protocols:
  - name: Qwen Protocol
    schemes:
      - qwen
publish:
  provider: generic
  url: https://github.com/quantmind-br/qwen-studio-linux-releases/releases/latest/download/
linux:
  category: Network
  executableName: qwen
  syncDesktopName: true
  icon: build/icons
  maintainer: qwen.ai
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  desktop:
    entry:
      StartupWMClass: com.qwen.chat
appImage:
  artifactName: Qwen-${version}-linux-x86_64.${ext}
deb:
  artifactName: qwen_${version}_amd64.${ext}
afterPack: scripts/after-pack.mjs
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
artifactBuildCompleted: scripts/artifact-build-completed.mjs
